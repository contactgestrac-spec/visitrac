<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout : une colonne mobile-first (formulaire terrain), barre d'action fixe en bas ; le rapport est une feuille A4 blanche. */
:root {
  --bg: #EEF3F1; --surface: #FFFFFF; --fg: #16211E; --muted: #5A6B66; --line: #D6E0DC;
  --accent: #06796B; --accent-ink: #FFFFFF; --accent-soft: #DDEFEB;
  --warn: #A24E07; --warn-soft: #FBEEDF; --bad: #B42318; --bad-soft: #FCE9E7; --ok: #1D7A3B;
  --admin: #5B4BA8; --admin-soft: #ECE9F8;
  /* Feuille de rapport : toujours papier blanc, comme le PDF */
  --paper: #FFFFFF; --paper-ink: #1E2624; --paper-muted: #6B7775; --paper-zebra: #F2F7F5; --paper-line: #DCE5E2; --brand: #06796B;
  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --font-paper: Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1413; --surface: #17211F; --fg: #E4EDEA; --muted: #98AAA5; --line: #2A3A36;
  --accent: #3DB5A3; --accent-ink: #04211C; --accent-soft: #12332D;
  --warn: #F0A35A; --warn-soft: #3A2814; --bad: #F2877C; --bad-soft: #3B1C19; --ok: #6FD08E;
  --admin: #B3A8F0; --admin-soft: #27224A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #17211F; --fg: #E4EDEA; --muted: #98AAA5; --line: #2A3A36;
  --accent: #3DB5A3; --accent-ink: #04211C; --accent-soft: #12332D;
  --warn: #F0A35A; --warn-soft: #3A2814; --bad: #F2877C; --bad-soft: #3B1C19; --ok: #6FD08E;
  --admin: #B3A8F0; --admin-soft: #27224A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.top-in { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; flex-direction: column; gap: 10px }
.brandrow { display: flex; align-items: center; gap: 10px; justify-content: space-between }
.logo-chip { background: #FFFFFF; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center }
.logo-chip img { height: 26px; width: auto; display: block }
.appname { display: flex; align-items: center; gap: 10px } .appname b { font-family: var(--font-cond); font-size: 22px; letter-spacing: .02em; color: var(--accent) }
.pill { font-family: var(--font-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap }
.trames { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px }
.trames button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap }
.trames button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.modes { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px }
.modes button { border: 0; background: transparent; padding: 8px; border-radius: 7px; font-weight: 600; font-size: 15px; color: var(--muted) }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12) }

.wrap { max-width: 820px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 140px; display: flex; flex-direction: column; gap: 14px }
.intro { font-size: 14.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px }
.intro strong { color: var(--fg) }
.intro-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.sec > h2 { margin: 0; font-family: var(--font-cond); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; text-wrap: balance }
.sec > h2 .count { font-family: var(--font); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted) }
.sec > h2 .count.done { background: var(--accent-soft); color: var(--accent) }
.sec-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px }
.sec.admin-sec > h2 { color: var(--admin) }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.field > label, .field > .lbl { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap }
.req { color: var(--bad); font-weight: 700 }
.tag { font-family: var(--font-cond); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; font-weight: 600 }
.tag.admin { background: var(--admin-soft); color: var(--admin) }
.tag.calc { background: var(--accent-soft); color: var(--accent) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr } }

.inp { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 17px }
textarea.inp { min-height: 96px; resize: vertical }
.inp:focus { border-color: var(--accent); background: var(--surface) }
.unitbox { position: relative }
.unitbox .inp { padding-right: 52px }
.unitbox .u { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none }
.calcout { min-height: 48px; display: flex; align-items: center; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; font-size: 17px }

.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { position: relative; display: inline-flex }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer }
.chip span { padding: 10px 14px; min-height: 44px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 500 }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px }

/* Photos */
.photos { display: flex; flex-direction: column; gap: 8px }
.photo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.photo-count { font-size: 14px; font-weight: 600; color: var(--muted) }
.photo-count.ok { color: var(--ok) }
.photo-count.ko { color: var(--warn) }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px }
.thumb { position: relative; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--line) }
.thumb img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block }
.r-photos img { background: #FFFFFF }
.thumb .kb { position: absolute; left: 4px; bottom: 4px; font-size: 11px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; border-radius: 4px }
.thumb .x { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1 }
.addphoto { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 1px dashed var(--accent); color: var(--accent); font-weight: 600; background: transparent }
.addphoto input { position: absolute; inset: 0; opacity: 0; cursor: pointer }

/* Façades */
.facade { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--surface) }
.facade.st-exclu { border-style: dashed; opacity: .85 }
.facade-head { display: flex; gap: 8px; align-items: center }
.facade-head .inp { font-weight: 700 }
.iconbtn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; color: var(--muted) }
.iconbtn:hover { color: var(--bad); border-color: var(--bad) }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.seg .chip span { width: 100%; justify-content: center; padding: 8px 6px; min-height: 40px; font-size: 15px }
.seg .chip { display: flex }
.seg.two { grid-template-columns: repeat(2, 1fr) }
.seg .chip.s-exclu input:checked + span { background: var(--bad); border-color: var(--bad); color: #fff }
.seg .chip.s-option input:checked + span { background: #2F62B5; border-color: #2F62B5; color: #fff }
.fsum { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14.5px; padding: 8px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--fg) }
.fsum b { color: var(--accent) }
.fsum.err { background: var(--bad-soft) }
.fsum.err b { color: var(--bad) }
.ouv-title { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center }
.ouv-grid { display: grid; grid-template-columns: 74px 52px minmax(0,1fr) minmax(0,1fr) 40px; gap: 6px; align-items: center }
.ouv-grid .h { font-size: 12px; color: var(--muted); font-family: var(--font-cond); letter-spacing: .05em; text-transform: uppercase }
.ouv-grid .inp { min-height: 44px; padding: 8px; font-size: 16px; text-align: center }
.ouv-grid select.inp { text-align: left; padding: 8px 4px }
.ouv-grid .iconbtn { width: 40px; height: 40px; font-size: 16px }
.ouv-s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -2px; padding-left: 2px }
.ghost { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-height: 44px; padding: 8px 14px; font-weight: 600; color: var(--accent) }

.totals { border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface) }
.totals h3 { margin: 0 0 2px; font-family: var(--font-cond); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent) }
.trow { display: flex; justify-content: space-between; gap: 10px; font-size: 15.5px }
.trow span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap }
.trow.big { font-size: 18px; border-top: 1px solid var(--line); padding-top: 6px }
.trow.big span:last-child { color: var(--accent); font-weight: 700 }
.trow.sub { color: var(--muted); font-size: 14px }
.formula { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px }

/* Barre d'action */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ab-in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px }
.prog { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) }
.bar { height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 12px 18px; border-radius: 10px; min-height: 48px; font-size: 16px; white-space: nowrap }

.panel { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15px }
.panel h3 { margin: 0; font-size: 16px }
.panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px }
.panel.ko { background: var(--warn-soft); border: 1px solid var(--warn) }
.panel.ko h3 { color: var(--warn) }
.panel.okp { background: var(--accent-soft); border: 1px solid var(--accent) }
.panel.okp h3 { color: var(--accent) }
.saved { font-size: 13px; color: var(--muted) }

/* ===== Rapport (feuille) ===== */
.sheet-wrap { overflow-x: auto; margin-inline: -4px; padding: 4px }
.sheet { background: var(--paper); color: var(--paper-ink); font-family: var(--font-paper); font-size: 11.5px; line-height: 1.4; max-width: 794px; margin: 0 auto; padding: 36px 34px 28px; box-shadow: 0 2px 14px rgba(0,0,0,.14); border-radius: 2px; display: flex; flex-direction: column; gap: 12px }
@media (max-width: 520px) { .sheet { padding: 22px 16px 18px; font-size: 10.5px } }
.r-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 2px solid var(--brand); margin-bottom: 6px }
.r-head img { width: 170px; max-width: 45%; height: auto }
.r-head .rt { text-align: right; display: flex; flex-direction: column; gap: 3px; margin-left: auto }
.r-head .rt b.t { color: var(--brand); font-size: 17px; letter-spacing: .01em }
.r-head .rt .s { color: var(--paper-muted) }
.r-sec { display: flex; flex-direction: column }
.r-sec > .hb { background: var(--brand); color: #fff; font-weight: 700; padding: 6px 10px; text-transform: uppercase; font-size: 11.5px }
.r-tab { width: 100%; border-collapse: collapse }
.r-tab td, .r-tab th { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--paper-line) }
.r-tab tr:nth-child(even) td { background: var(--paper-zebra) }
.r-tab td:first-child { font-weight: 700; width: 40% }
.r-tab.data td:first-child { font-weight: 400; width: auto }
.r-tab.data th { background: var(--paper-zebra); font-size: 10.5px; color: var(--paper-ink); border-bottom: 2px solid var(--brand) }
.r-tab.data td.n, .r-tab.data th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.r-tab tr.hl td { background: #DFF0EC; color: var(--brand); font-weight: 700 }
.r-tab .calcmark { color: var(--brand); font-size: 9.5px; font-weight: 700; margin-left: 4px }
.r-scroll { overflow-x: auto }
.r-cap { color: var(--brand); font-weight: 700; padding: 10px 10px 4px }
.r-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px; background: #F4F7F6; border: 1px solid var(--paper-line) }
.r-photos figure { margin: 0; display: flex; flex-direction: column; gap: 4px; align-items: center }
.r-photos img, .r-photos .ph { width: 100%; aspect-ratio: 4/3; object-fit: contain; display: block }
.r-photos img { background: #FFFFFF }
.r-photos .ph { background: repeating-linear-gradient(45deg, #EDF2F0 0 8px, #E4EBE8 8px 16px); display: flex; align-items: center; justify-content: center; color: var(--paper-muted); font-size: 10px; text-align: center; padding: 6px }
.r-photos figcaption { color: var(--paper-muted); font-style: italic; font-size: 10px; text-align: center }
.r-box { border: 1.5px solid var(--brand); background: #EAF5F2; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px }
.r-box .big { color: var(--brand); font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.r-box.warnb { border-color: #C46A12; background: #FDF1E4 }
.r-box.warnb .big { color: #9A4E06 }
.r-note { color: var(--paper-muted); font-size: 10px }
.r-text { padding: 8px 10px; white-space: pre-wrap }
.r-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px }
.r-sign div { min-height: 64px; border-bottom: 1px solid var(--paper-line) }
.r-foot { border-top: 1px solid var(--paper-line); padding-top: 8px; text-align: center; color: var(--paper-muted); font-size: 9.5px }
.admin-note { font-size: 14px; color: var(--muted) }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px }
.copybox { width: 100%; min-height: 120px; font-size: 12px; font-family: ui-monospace, Menlo, monospace }
.defs { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 14.5px; background: var(--bg) }
.defs b.s-inclus { color: var(--accent) } .defs b.s-option { color: #2F62B5 } .defs b.s-exclu { color: var(--bad) }
.hint { font-size: 14px; color: var(--muted); margin-top: -4px }
.aide { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px }
.warnline { font-size: 14px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px }
.r-disclaimer { border: 1.5px solid #B42318; background: #FCECEA; color: #7A1A12; padding: 8px 12px; font-weight: 700; font-size: 11px }
.r-box .warn { color: #9A4E06; font-size: 10px; font-weight: 700 }

@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }

[hidden] { display: none !important }
body { margin: 0 } img { max-width: 100% }
.pill.p-ok { background: var(--accent-soft); color: var(--accent) } .pill.p-ko { background: var(--bad-soft); color: var(--bad) } .pill.p-wait { background: var(--warn-soft); color: var(--warn) }
.visitbar { display: flex; align-items: center; gap: 10px } .vt-nom { font-family: var(--font-cond); font-size: 17px; letter-spacing: .03em }
.h1 { font-family: var(--font-cond); font-size: 24px; letter-spacing: .02em }
.choix { display: grid; gap: 10px }
.carte { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--fg); width: 100% }
.carte b { font-size: 17px } .carte:hover { border-color: var(--accent) }
#liste { display: flex; flex-direction: column; gap: 10px }
.ligne .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.st { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); white-space: nowrap }
.st.st-ok { background: var(--accent-soft); color: var(--accent) }
.vide { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--muted) } .vide b { color: var(--fg) }
a.primary, a.ghost { text-decoration: none; display: inline-flex; align-items: center }
form.field { gap: 10px }
table.r-head { width: 100%; border-collapse: collapse; border-bottom: 2px solid var(--brand) } table.r-head td { vertical-align: top; padding-bottom: 14px }
table.r-head .rt { text-align: right; line-height: 1.7 } table.r-head .t { color: var(--brand); font-size: 17px } table.r-head .s { color: var(--paper-muted) }
table.r-photos { display: table; width: 100%; border-collapse: separate; border-spacing: 8px; padding: 0 } table.r-photos td { width: 50%; text-align: center; vertical-align: top }
table.r-photos .fig img, table.r-photos .ph { width: 100%; aspect-ratio: 4/3; object-fit: contain; background: #FFFFFF; display: block }
table.r-photos .cap { color: var(--paper-muted); font-style: italic; font-size: 10px; padding-top: 3px }
table.big { width: 100%; border-collapse: collapse } table.big td { color: var(--brand); font-weight: 700; font-size: 14px; padding: 1px 0 } table.big td.bn { text-align: right; white-space: nowrap }
.warnb table.big td { color: #9A4E06 }
.st.st-new { background: #E3ECFB; color: #2F62B5 } .st.st-ko { background: var(--bad-soft); color: var(--bad) }
.panel.mission { background: var(--surface); border: 2px solid var(--accent); gap: 10px } .panel.mission .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.panel.mission h3 { color: var(--accent) } details summary { cursor: pointer; list-style: none } details[open] summary { margin-bottom: 8px }
.sous { border-left: 3px solid var(--accent-soft); padding-left: 12px; display: flex; flex-direction: column; gap: 12px }
.merci { text-align: center; align-items: center; padding: 32px 18px } .merci b { font-size: 20px; color: var(--accent) }
select.inp { appearance: auto }
canvas.sig { width: 100%; height: 170px; border: 2px dashed var(--accent); border-radius: 10px; background: #FFFFFF; touch-action: none; display: block }

  const rows = facades.map(f => {

    const brut = (L != null && H != null) ? L * H : null;
    let ded = 0, tab = 0, app = 0, bag = 0, incomplete = false;
    const ouv = f.ouvertures.map(o => {
      const q = num(o.qte) ?? 1, l = num(o.l), h = num(o.h);
      if (l == null || h == null) { incomplete = true; return { ...o, q, l, h, s: null }; }

        const ifd = (off, want) => { const n = u16(t + off); for (let i = 0; i < n; i++) { const e = t + off + 2 + i * 12; if (u16(e) === want) return u32(e + 8); } return null; };
        const exif = ifd(u32(t + 4), 0x8769);
        const at = (exif != null ? ifd(exif, 0x9003) : null) ?? ifd(u32(t + 4), 0x0132);
        if (at == null) return null;
        const v = str(at, 20).match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
        return v ? `${v[3]}/${v[2]}/${v[1]} à ${v[4]}:${v[5]}` : null;
      }
      o += 2 + len;
    }
  } catch (e) {}
  return null;
}

const fac = (nom, statut, L, H, o = [], commentaire = '') => ({ id: uid(), nom, statut, largeur: fr(L), hauteur: fr(H), ouvertures: o, commentaire });

/* ---------- Vérification ---------- */
function validate() {
  const t = T(), st = S(), v = st.values, out = [];
  let total = 0, done = 0;
  for (const sec of t.sections) {
    if (sec.facades) {
      const actives = st.facades.filter(f => f.statut !== 'exclu');
      total++; if (actives.length) done++; else out.push([sec.titre, 'Aucune façade renseignée']);
      for (const f of st.facades.filter(f => f.statut === 'exclu')) { total++; if (String(f.commentaire || '').trim()) done++; else out.push([sec.titre, `${f.nom || 'Façade exclue'} : indique pourquoi elle est exclue`]); }
      for (const f of actives) {
        total++;
        const ok = num(f.largeur) != null && num(f.hauteur) != null && (f.forme !== 'pignon' || num(f.faitage) != null);
        if (ok) done++; else out.push([sec.titre, `${f.nom || 'Façade sans nom'} : ${f.forme === 'pignon' ? 'largeur, hauteur à l\'égout ou au faîtage manquante' : 'largeur ou hauteur manquante'}`]);
        if (f.forme === 'pignon' && num(f.faitage) != null && num(f.hauteur) != null && num(f.faitage) <= num(f.hauteur)) out.push([sec.titre, `${f.nom} : la hauteur au faîtage doit être plus grande que la hauteur à l'égout`]);
        if (f.ouvertures.some(o => num(o.l) == null || num(o.h) == null)) out.push([sec.titre, `${f.nom} : une ouverture n'a pas ses dimensions`]);
        const r = iteMetres([f]).rows[0];
        if (r.net != null && r.net < 0) out.push([sec.titre, `${f.nom} : les ouvertures dépassent la surface brute`]);
        total++; const n = P('fac-' + f.id).length;
        if (n >= sec.photosMin) done++; else out.push([sec.titre, `${f.nom} : ${n}/${sec.photosMin} photos`]);
      }
      continue;
    }
    if (sec.surfaces) {
      for (const x of st.surfaces || []) {
        const nm = x.nom || 'Surface sans nom';
        total++; if (String(x.nom || '').trim()) done++; else out.push([sec.titre, 'Une surface n\'a pas de description']);
        total++; if (surfMetres([x]).rows[0].s != null) done++; else out.push([sec.titre, `${nm} : dimensions manquantes`]);
        total++; if (P('surf-' + x.id).length) done++; else out.push([sec.titre, `${nm} : 0/1 photo`]);
      }
      continue;
    }
    for (const ch of sec.champs) {
      if (ch.admin || ch.type === 'calc') continue;
      if (ch.type === 'photos') { if (!ch.min) continue; total++; const n = P(ch.id).length; if (n >= ch.min) done++; else out.push([sec.titre, `${ch.label} : ${n}/${ch.min} photo${ch.min > 1 ? 's' : ''}`]); continue; }
      if (!ch.req) continue;
      total++; if (String(v[ch.id] ?? '').trim()) done++; else out.push([sec.titre, `${ch.label} : non renseigné`]);
    }
  }
  total++; if (P('sig-presta').length && String(v.sig_presta_nom || '').trim()) done++; else out.push(['Signatures', 'Signature et nom du prestataire']);
  return { out, total, done };
}

function fieldHTML(ch, v) {
  if (PRESTA && ch.admin) return '';
  const tags = (ch.req ? '<span class="req" aria-label="obligatoire">*</span>' : '') + (ch.admin ? '<span class="tag admin">Rempli par GESTRAC</span>' : '') + (ch.type === 'calc' ? '<span class="tag calc">Calculé</span>' : '') + (ch.auto ? '<span class="tag calc">Automatique depuis l\'adresse</span>' : '');

  if (ch.type === 'calc') return `<div class="field"><span class="lbl">${esc(ch.label)}${tags}</span><div class="calcout num" data-out="calc:${ch.id}">—</div></div>`;
  if (ch.type === 'choice') return `<div class="field" role="radiogroup" aria-labelledby="${id}_l"><span class="lbl" id="${id}_l">${esc(ch.label)}${tags}</span><div class="chips">${ch.options.map((o, i) =>

  if (ch.type === 'textarea') return `<div class="field"><label for="${id}">${esc(ch.label)}${tags}</label><textarea class="inp" id="${id}" data-k="${ch.id}">${val}</textarea></div>`;
  if (ch.type === 'number') return `<div class="field"><label for="${id}">${esc(ch.label)}${tags}</label><div class="unitbox"><input class="inp num" id="${id}" data-k="${ch.id}" inputmode="decimal" value="${val}" autocomplete="off"><span class="u">${esc(ch.unit || '')}</span></div></div>`;

}

  const list = P(slot), n = list.length;

  return `<div class="photos" data-slot-wrap="${esc(slot)}">

function refresh() {
  const t = T(), st = S(), c = compute(), outs = {};
  for (const [k, val] of Object.entries(c.calc)) { const ch = t.sections.flatMap(s => s.champs || []).find(x => x.id === k); outs['calc:' + k] = calcText(ch, val); }
  if (c.ite) {
    for (const r of c.ite.rows) {
      outs['fb:' + r.f.id] = r.brut == null ? '—' : fmt(r.brut) + ' m²';
      outs['fhm:' + r.f.id] = r.H == null ? '—' : fmt(r.H) + ' m';
      outs['fd:' + r.f.id] = '−' + fmt(r.ded) + ' m²';
      outs['fn:' + r.f.id] = r.net == null ? '—' : fmt(r.net) + ' m²';
      for (const o of r.ouv) outs['ouv:' + o.id] = o.s == null ? 'Dimensions manquantes' : `${TYPES_OUV[o.type]} · ${o.q > 1 ? o.q + ' × ' : ''}${fmt(o.l)} × ${fmt(o.h)} = ${fmt(o.s)} m²`;
      const box = document.querySelector(`[data-out-cls="fac:${r.f.id}"]`);
      if (box) box.classList.toggle('err', r.net != null && r.net < 0);
    }
    const tt = c.ite.tot, el = document.getElementById('iteTotals');
    if (el) el.innerHTML = `<h3>Récapitulatif · ${tt.n} façade${tt.n > 1 ? 's' : ''} incluse${tt.n > 1 ? 's' : ''}</h3>
      <div class="trow"><span>Surface brute totale</span><span>${fmt(tt.brut)} m²</span></div>
      <div class="trow"><span>Déductions menuiseries</span><span>−${fmt(tt.ded)} m²</span></div>
      <div class="trow big"><span>Surface nette ITE</span><span>${fmt(tt.net)} m²</span></div>
      <div class="trow sub"><span>Tableaux & voussures</span><span>${fmt(tt.tab)} ml</span></div>
      <div class="trow sub"><span>Appuis de fenêtres</span><span>${fmt(tt.app)} ml</span></div>
      <div class="trow sub"><span>Baguettes d'angle</span><span>${fmt(tt.bag)} ml</span></div>
      ${c.ite.options.length ? `<div class="trow sub"><span>En option (${c.ite.options.map(r => esc(r.f.nom)).join(', ')})</span><span>${fmt(c.ite.options.reduce((a, r) => a + (r.net ?? 0), 0))} m²</span></div>` : ''}
      <div class="formula">Brute = L × H · Nette = brute − Σ(qté × l × h) · Tableaux = Σ qté × (2h + l) · Appuis = Σ largeurs des fenêtres F · Baguettes = Σ qté × 2(l + h). Les ouvertures « Autre » sont déduites mais n'entrent pas dans les ml.</div>`;
  }
  if (c.surf) {
    for (const r of c.surf.rows) outs['ss:' + r.x.id] = r.s == null ? '—' : fmt(r.s) + ' m²' + (r.directe ? ' (relevée directement)' : r.L != null ? ` (${fmt(r.L)} × ${fmt(r.l)})` : '');
    const el = document.getElementById('surfTotals');
    if (el) el.innerHTML = `<h3>Récapitulatif · ${c.surf.rows.length} surface${c.surf.rows.length > 1 ? 's' : ''}</h3><div class="trow big"><span>Surface totale</span><span>${fmt(c.surf.total)} m²</span></div>`;
  }
  document.querySelectorAll('[data-out]').forEach(e => { e.textContent = outs[e.dataset.out] ?? '—'; });
  const pw = document.getElementById('pacWarn');
  if (pw) pw.innerHTML = c.pac.warn.map(m => `<div class="warnline">⚠ ${esc(m)}</div>`).join('');
  // compteurs par section + progression
  const val = validate();
  lastCheck = val;
  for (const sec of t.sections) {
    const e = document.querySelector(`[data-out-sec="${sec.id}"]`); if (!e) continue;
    const miss = val.out.filter(m => m[0] === sec.titre).length;
    if (sec.admin) { e.textContent = 'GESTRAC'; e.className = 'count'; continue; }
    e.textContent = miss ? `${miss} à compléter` : 'Complet'; e.className = 'count' + (miss ? '' : ' done');
  }
  document.getElementById('progTxt').textContent = `${val.done} / ${val.total} éléments obligatoires`;
  document.getElementById('progBar').style.width = (val.total ? val.done / val.total * 100 : 0) + '%';
  const sv = document.getElementById('saved');
  if (sv) sv.textContent = savedAt ? `Brouillon enregistré sur cet appareil à ${savedAt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}, photos comprises.` : '';
}

function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      const src = cv.toDataURL('image/jpeg', 0.72);
      res({ src, kb: Math.round(src.length * 0.75 / 1024), w: cv.width, h: cv.height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image illisible')); };
    img.src = url;
  });
}

/* ---------- Signatures au doigt ---------- */
const MENTIONS = {
  presta: "En signant, je confirme avoir réalisé cette visite sur place et que les informations, mesures et photos transmises correspondent à ce que j'ai constaté.",
  client: "Le client atteste avoir reçu ce jour la visite d'un technicien pour une visite technique." };
function signaturesHTML() {
  const bloc = (qui, titre, req) => {
    const p = P('sig-' + qui)[0], nomK = 'sig_' + qui + '_nom';
    return `<div class="facade"><b>${titre}${req ? '<span class="req">*</span>' : ' <span class="admin-note">(facultatif)</span>'}</b>
      <span class="hint">${esc(MENTIONS[qui])}</span>
      ${fieldHTML({ id: nomK, label: qui === 'presta' ? 'Nom du prestataire' : 'Nom du client', type: 'text', req }, S().values)}
      ${p ? `<div class="sig-ok"><img ${p.fileId ? `data-fid="${p.fileId}"` : ''} src="${p.src || ''}" alt="Signature"><span class="admin-note">${p._up ? 'Envoi…' : 'Signé le ' + esc(p.signe_le || '')}</span><div><button class="linkbtn" data-act="sig-refaire" data-qui="${qui}">Refaire la signature</button></div></div>`
        : `<canvas class="sig" id="sig-${qui}" aria-label="Zone de signature"></canvas><div class="btnrow"><button class="primary" data-act="sig-valider" data-qui="${qui}">Valider la signature</button><button class="ghost" data-act="sig-effacer" data-qui="${qui}">Effacer</button></div>`}
    </div>`;
  };
  return `<section class="sec"><h2><span>Signatures</span></h2><div class="sec-body"><span class="admin-note">Signe avec le doigt dans le cadre.</span>${bloc('presta', 'Signature du prestataire', true)}${bloc('client', 'Signature du client', false)}</div></section>`;
}
function initSignatures() {
  document.querySelectorAll('canvas.sig').forEach(cv => {
    const r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * k); cv.height = Math.round(r.height * k);
    const g = cv.getContext('2d'); g.scale(k, k); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0B1F3A';
    cv.dataset.vide = '1';
    let enTrait = false, last = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.addEventListener('pointerdown', e => { enTrait = true; last = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
    cv.addEventListener('pointermove', e => { if (!enTrait) return; const q = pt(e); g.beginPath(); g.moveTo(...last); g.lineTo(...q); g.stroke(); last = q; cv.dataset.vide = '0'; e.preventDefault(); });
    const fin = () => { enTrait = false; };
    cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
  });
}
function sigEffacer(qui) { const cv = $('sig-' + qui); if (!cv) return; cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); cv.dataset.vide = '1'; }
async function sigValider(qui, btn) {
  const cv = $('sig-' + qui); if (!cv) return;
  if (cv.dataset.vide === '1') return alertePanel('Signe d\'abord dans le cadre avec le doigt.');
  // fond blanc + JPEG : même format que les photos
  const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
  const g = out.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, out.width, out.height); g.drawImage(cv, 0, 0);
  const src = out.toDataURL('image/jpeg', 0.9), d = new Date();
  const p = { src, w: out.width, h: out.height, kb: Math.round(src.length * 0.75 / 1024), cap: qui === 'presta' ? 'Signature du prestataire' : 'Signature du client',
    signe_le: `${dateFr(today())} à ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`, _up: true };
  btn.disabled = true;
  P('sig-' + qui).splice(0, 9, p); renderSaisie();
  try { const r = await call('envoyerPhoto', { id: V.id, data: src, nom: p.cap }); p.fileId = r.fileId; delete p._up; cachePhotos.set(r.fileId, src); save(); }
  catch (e) { P('sig-' + qui).splice(0); alertePanel('La signature n\'a pas pu être envoyée (réseau ?). Refais-la. Détail : ' + e.message); }
  renderSaisie();
}
function validationHTML(num, v) {
  const sp = P('sig-presta').filter(p => !PDF || p.fileId)[0], sc = P('sig-client').filter(p => !PDF || p.fileId)[0];
  const img = p => { if (!PDF) return `<img ${p.fileId ? `data-fid="${p.fileId}"` : ''} src="${p.src || ''}" alt="" style="max-height:90px;max-width:100%">`;
    let w = 220, h = 90; if (p.w && p.h) { const k = Math.min(220 / p.w, 90 / p.h); w = Math.round(p.w * k); h = Math.round(p.h * k); } return `<img src="vt-photo:${p.fileId}" width="${w}" height="${h}" alt="">`; };
  const cell = (p, titre, nom, mention) => `<td><b>${titre}</b>${nom ? ' : ' + esc(nom) : ''}<br>${img(p)}<br><span class="r-note">${esc(mention)}<br>Signé le ${esc(p.signe_le || '')}</span></td>`;
  const tete = `<div class="r-sec"><div class="hb">${ROM[num]}. Validation</div><table class="r-tab"><tbody><tr><td>Contrôleur</td><td>${esc(ENTREPRISE.nom)} — ${esc(ENTREPRISE.controleur)}</td></tr><tr><td>Date</td><td>${dateFr(v.date)}</td></tr></tbody></table>`;
  if (!sp && !sc) return tete + (PDF ? '' : '<table class="r-sign"><tr><td>Signature du prestataire :</td><td>Signature du client :</td></tr></table>') + '</div>';

}

  const val = validate(), miss = val.out;
  PDF = false;
  const corps = rapportHTML();
  $('main').innerHTML = `
    <div class="intro"><strong>Aperçu du rapport</strong><span>Vérifie le rapport, puis génère le PDF : il est enregistré dans ton Drive, dans le dossier du client.</span></div>
    ${miss.length ? `<div class="panel ko"><h3>${miss.length} point${miss.length > 1 ? 's' : ''} à vérifier</h3><ul>${miss.slice(0, 8).map(m => `<li>${esc(m[1])}</li>`).join('')}${miss.length > 8 ? `<li>et ${miss.length - 8} autre(s)…</li>` : ''}</ul><span class="admin-note">Tu peux générer le PDF malgré tout (visite faite par toi, information non disponible…).</span></div>` : ''}
    <div class="btnrow"><button class="primary" data-act="pdf">Générer le PDF dans le Drive</button>${V.statut === 'Rapport généré' ? '<button class="ghost" data-act="envoye">Marquer le rapport comme envoyé au client</button>' : V.statut === 'Rapport envoyé' ? '<span class="st st-ok">Rapport envoyé au client</span>' : ''}</div>
    <div id="pdfOut"></div>
    <div class="sheet-wrap"><article class="sheet" aria-label="Rapport">${corps}</article></div>`;
  chargerPhotos();
}
async function genererPdf() {
  const out = $('pdfOut'), t = T(), v = S().values;
  if (Object.values(S().photos || {}).some(l => l.some(p => p._up))) { out.innerHTML = '<div class="warnline">Des photos sont encore en cours d\'envoi : attends quelques secondes et réessaie.</div>'; return; }
  out.innerHTML = '<div class="panel okp"><h3>Génération du PDF en cours…</h3><span>Cela peut prendre jusqu\'à une minute avec beaucoup de photos. Ne ferme pas la page.</span></div>';
  try {
    await flush();
    PDF = true;
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${PDF_CSS}</style></head><body>${rapportHTML()}</body></html>`;
    PDF = false;
    const nom = `${v.client || 'Client'} - ${t.court} - GESTRAC`;
    const r = await api('genererPdf', { id: V.id, html, nomFichier: nom, classement: { client: (V.mission && V.mission.client) || v.donneur || v.client, chantier: v.adresse, type: t.court, date: dateFr(v.date).split('/').join('-') } });
    V.statut = 'Rapport généré'; liste = null;
    out.innerHTML = `<div class="panel okp"><h3>PDF enregistré dans ton Drive</h3><div class="btnrow"><a class="primary" href="${esc(r.url)}" target="_blank" rel="noopener">Ouvrir le PDF</a><a class="ghost" href="${esc(r.dossier)}" target="_blank" rel="noopener">Ouvrir le dossier</a></div><span class="admin-note">Les anciennes versions du PDF sont gardées dans le même dossier. Quand tu as envoyé le PDF à ton client, appuie sur « Marquer le rapport comme envoyé » : son suivi sera mis à jour.</span><div><button class="ghost" data-act="envoye">Marquer le rapport comme envoyé au client</button></div></div>`;
  } catch (e) { PDF = false; out.innerHTML = `<div class="panel ko"><h3>Le PDF n'a pas pu être généré</h3><span>${esc(e.message)}</span></div>`; }
}

/* ---------- Portail client pro (lien ?c=…) ---------- */
let portail = null;

  if (!portail) {
    $('main').innerHTML = '<div class="admin-note">Chargement…</div>';
    try { portail = await apiC('infos'); } catch (e) { $('main').innerHTML = `<div class="vide"><b>Lien indisponible</b><span>${esc(e.message)}</span></div>`; return; }
  }
  const types = TRAMES.map((t, i) => `<label class="chip"><input type="radio" name="dc_trame" value="${t.id}" ${i === 0 ? 'checked' : ''}><span>${esc(t.court)}</span></label>`).join('');
  $('main').innerHTML = `<div class="intro"><strong class="h1">Demande de visite technique</strong><span>${esc(portail.raison_sociale)} · renseignez votre client, GESTRAC organise la visite.</span></div>
    ${okMsg ? `<div class="panel okp"><h3>Demande envoyée</h3><span>${esc(okMsg)}</span></div>` : ''}
    <section class="sec"><h2><span>Nouvelle demande</span></h2><div class="sec-body">
      <div class="grid2">${champ('dc_nom', 'Nom et prénom du client', '', { req: true })}${champ('dc_tel', 'Téléphone du client', '', { type: 'tel' })}</div>
      ${champ('dc_adresse', 'Adresse du chantier', '', { req: true, ph: 'N°, rue, code postal, ville' })}
      ${champ('dc_entreprise', "Entreprise qui réalise les travaux (au nom de laquelle le technicien se présente chez le client)", '')}
      <div class="field"><span class="lbl">Type de visite<span class="req">*</span></span><div class="chips">${types}</div></div>
      <div class="field"><label for="dc_comm">Commentaire<span class="req">*</span></label><textarea class="inp" id="dc_comm" placeholder="Précisez le type de visite (ex. : ITE avant travaux, façade arrière uniquement…) et toute remarque utile sur le client (accès, horaires, digicode…)."></textarea></div>
      <div id="dc_out"></div><button class="primary" data-act2="demander">Envoyer la demande</button>
    </div></section>
    <section class="sec"><h2><span>Mes demandes</span><span class="count">${portail.demandes.length}</span></h2><div class="sec-body">
      ${portail.demandes.length ? portail.demandes.map(d => `<div class="carte ligne"><span class="l1"><b>${esc(d.client || '—')}</b><span class="st ${d.etat === 'Rapport envoyé' ? 'st-ok' : d.etat === 'Visite réalisée' ? 'st-new' : d.etat === 'Annulée' ? 'st-ko' : ''}">${esc(d.etat)}</span></span><span>${esc(nomTrame(d.trame))}${d.etat === 'Planifiée' && d.date_prevue ? ' · prévue le ' + dateFr(d.date_prevue) : ''}</span><span class="admin-note">${esc(d.adresse)}</span></div>`).join('')
        : '<span class="admin-note">Vos demandes apparaîtront ici avec leur avancement : reçue, planifiée, visite réalisée, rapport envoyé.</span>'}
    </div></section>`;
}
async function envoyerDemande(btn) {
  const d = { nom: valeur('dc_nom'), tel: valeur('dc_tel'), adresse: valeur('dc_adresse'), entreprise: valeur('dc_entreprise'), commentaire: valeur('dc_comm'), trame: (document.querySelector('[name="dc_trame"]:checked') || {}).value };
  if (!d.nom || !d.adresse || !d.commentaire) return message('dc_out', false, "Le nom du client, l'adresse et le commentaire sont obligatoires");
  btn.disabled = true; message('dc_out', true, 'Envoi de la demande…');
  try { await apiC('demander', d); portail = null; await renderPortail(`La visite pour ${d.nom} a bien été transmise à GESTRAC. Vous pouvez suivre son avancement ci-dessous.`); window.scrollTo(0, 0); }
  catch (e) { btn.disabled = false; message('dc_out', false, "La demande n'a pas pu être envoyée", esc(e.message)); }
}

/* ---------- Navigation ---------- */
const ONGLETS = [['missions', 'Missions'], ['clients', 'Clients'], ['prestataires', 'Prestataires']];
function renderNav() {
  const enVisite = vue === 'visite', vb = $('visitbar'), og = $('onglets');
  vb.hidden = !enVisite;
  if (enVisite) vb.innerHTML = PRESTA ? `<b class="vt-nom">${esc(T().court)}</b>` : `<button class="ghost" data-nav="missions">← Missions</button><b class="vt-nom">${esc(T().court)}</b>`;
  og.hidden = PRESTA || CLIENT || enVisite || vue === 'connexion';
  if (!og.hidden) og.innerHTML = ONGLETS.map(([k, l]) => `<button data-nav="${k}" aria-pressed="${vue === k || (vue === 'nouvelle' && k === 'missions')}">${l}</button>`).join('');
  $('modes').hidden = !enVisite || PRESTA;
  $('etat').hidden = !enVisite;
  $('mSaisie').setAttribute('aria-pressed', mode === 'saisie');
  $('mRapport').setAttribute('aria-pressed', mode === 'rapport');
  const verrou = PRESTA && V && VERROU.includes(V.statut);
  $('actionbar').hidden = !(enVisite && mode === 'saisie') || verrou;
  $('btnSend').textContent = PRESTA ? 'Envoyer la visite à GESTRAC' : 'Vérifier la visite';
}
function render() {
  renderNav();
  if (vue === 'portail') return renderPortail();
  if (vue === 'connexion') return renderConnexion();
  if (vue === 'missions') return renderMissions();
  if (vue === 'nouvelle') return renderNouvelle();
  if (vue === 'clients') return renderClients();
  if (vue === 'prestataires') return renderPrestataires();
  if (!V) return;
  if (PRESTA && VERROU.includes(V.statut)) return renderVerrouille();
  mode === 'saisie' ? renderSaisie() : renderRapport();
}
$('mSaisie').onclick = () => { mode = 'saisie'; render(); };
$('mRapport').onclick = () => { mode = 'rapport'; render(); window.scrollTo(0, 0); };
$('logoTop').src = LOGO;
document.body.addEventListener('click', async e => {
  const b = e.target.closest('[data-nav],[data-open],[data-fiche-client],[data-fiche-presta],[data-act2]'); if (!b) return;
  if (b.dataset.act2) { const f = { creerMission, sauverClient, sauverChantier, sauverPresta, lienClientMail: x => lienClient(x, 'mail'), lienClientCopie: x => lienClient(x, 'copie'), lienClientCouper: x => lienClient(x, 'couper'), demander: envoyerDemande }[b.dataset.act2]; return f && f(b); }
  if (b.dataset.open) { await flush(); return ouvrirVisite(b.dataset.open); }
  if (b.dataset.ficheClient !== undefined) { ficheClient = b.dataset.ficheClient || null; vue = 'clients'; render(); return window.scrollTo(0, 0); }
  if (b.dataset.fichePresta !== undefined) { fichePresta = b.dataset.fichePresta || null; vue = 'prestataires'; render(); return window.scrollTo(0, 0); }
  const n = b.dataset.nav;
  if (vue === 'visite') await flush();
  if (n === 'clients') ficheClient = null;
  if (n === 'prestataires') fichePresta = null;

  vue = n; render(); window.scrollTo(0, 0);
});
document.body.addEventListener('input', e => { if (e.target.id === 'recherche') { recherche = e.target.value; dessinerMissions(); } });
document.body.addEventListener('change', e => {
  if (e.target.dataset.filtre) { filtre = e.target.dataset.filtre; dessinerMissions(); }
  if (e.target.dataset.mission && vue === 'visite' && !PRESTA) majMission(e.target);
});

const main = $('main');
const findF = id => S().facades.find(f => f.id === id);
function onField(e) {
  if (vue !== 'visite' || !V) return;
  const el = e.target, st = S();
  if (el.dataset.k) { st.values[el.dataset.k] = el.value; }
  else if (el.dataset.ok) { const o = findF(el.dataset.f).ouvertures.find(x => x.id === el.dataset.o); o[el.dataset.ok] = el.value; }
  else if (el.dataset.sk) { st.surfaces.find(x => x.id === el.dataset.s)[el.dataset.sk] = el.value; }
  else if (el.dataset.fk) {
    const f = findF(el.dataset.f); f[el.dataset.fk] = el.value;
    if (el.dataset.fk === 'statut' || el.dataset.fk === 'forme') { save(); renderSaisie(); return; }
  } else return;
  save(); refresh();
}
main.addEventListener('input', onField);
main.addEventListener('change', e => { if (e.target.type === 'file') return addPhotos(e.target); if ((e.target.type === 'radio' || e.target.tagName === 'SELECT') && !e.target.dataset.mission && !e.target.dataset.filtre) onField(e); });
main.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || vue !== 'visite') return;
  const st = S(), a = b.dataset.act;
  if (a === 'pdf') return genererPdf();
  if (a === 'envoye') { b.disabled = true; try { await api('marquerEnvoye', { id: V.id }); V.statut = 'Rapport envoyé'; liste = null; renderRapport(); } catch (er) { b.disabled = false; message('pdfOut', false, 'Action impossible', esc(er.message)); } return; }
  if (a === 'planifier') {
    const d = valeur('pl_date'); if (!d) return message('plOut', false, 'Choisis la date convenue avec le client');
    b.disabled = true;
    try { await call('planifier', { date: d }); V.mission.date_prevue = d; renderSaisie(); message('plOut', true, 'Date enregistrée', 'Visite prévue le ' + dateFr(d) + '. GESTRAC la voit dans son tableau de bord.'); }
    catch (er) { b.disabled = false; message('plOut', false, 'Date non enregistrée', esc(er.message)); }
    return;
  }
  if (a === 'sig-effacer') return sigEffacer(b.dataset.qui);
  if (a === 'sig-valider') return sigValider(b.dataset.qui, b);
  if (a === 'sig-refaire') { const [p] = P('sig-' + b.dataset.qui).splice(0); if (p && p.fileId) call('supprimerPhoto', { fileId: p.fileId }).catch(() => {}); save(); return renderSaisie(); }
  if (a === 'copy') return copyData();
  if (a === 'copierLien') { if (V.lien) return copier(V.lien, 'missionOut'); message('missionOut', true, 'Préparation du lien…'); try { V.lien = (await call('lienMission', { id: V.id })).url; copier(V.lien, 'missionOut'); } catch (er) { message('missionOut', false, 'Lien indisponible', esc(er.message)); } return; }
  if (a === 'envoyerLien') {
    b.disabled = true; message('missionOut', true, 'Envoi de l\'e-mail…');
    try { await flush(); const r = await api('envoyerLien', { id: V.id, typeVisite: T().court }); if (!VERROU.includes(V.statut)) V.statut = 'Envoyée'; liste = null; renderSaisie(); message('missionOut', true, 'Lien envoyé', 'E-mail envoyé à ' + esc(r.email) + '.'); }
    catch (er) { b.disabled = false; message('missionOut', false, 'E-mail non envoyé', esc(er.message)); }
    return;
  }
  if (a === 'complement') {
    const msg = valeur('ms_compl'); if (!msg) return message('missionOut', false, 'Écris ce qu\'il manque');
    b.disabled = true;
    try { const r = await api('demanderComplement', { id: V.id, message: msg }); V.statut = 'Complément demandé'; liste = null; renderSaisie(); message('missionOut', true, 'Demande envoyée', r.email ? 'E-mail envoyé à ' + esc(r.email) + '. La visite est de nouveau modifiable par le prestataire.' : 'Le prestataire n\'a pas d\'e-mail : copie le lien et envoie-lui ton message.'); }
    catch (er) { b.disabled = false; message('missionOut', false, 'Demande non envoyée', esc(er.message)); }
    return;
  }
  if (a === 'soumettre') {
    b.disabled = true;
    try { await flush(); await call('soumettre', { donnees: propre(V.donnees) }); V.statut = 'Soumise'; render(); window.scrollTo(0, 0); }
    catch (er) { b.disabled = false; alertePanel(er.message); }
    return;
  }
  if (a === 'suppr') {
    if (pendingClear !== 'suppr') { pendingClear = 'suppr'; renderSaisie(); return; }
    pendingClear = null; await flush();
    try { await api('supprimer', { id: V.id }); V = null; vue = 'missions'; liste = null; render(); } catch (er) { alertePanel(er.message); }
    return;
  }
  if (a === 'add-fac') st.facades.push(fac(`Façade ${st.facades.length + 1}`, 'inclus', null, null));
  else if (a === 'del-fac') st.facades = st.facades.filter(f => f.id !== b.dataset.f);
  else if (a === 'add-ouv') findF(b.dataset.f).ouvertures.push({ id: uid(), type: 'F', qte: '1', l: '', h: '' });
  else if (a === 'del-ouv') { const f = findF(b.dataset.f); f.ouvertures = f.ouvertures.filter(o => o.id !== b.dataset.o); }
  else if (a === 'add-surf') st.surfaces.push(surf('', null, null));
  else if (a === 'del-surf') st.surfaces = st.surfaces.filter(x => x.id !== b.dataset.s);
  else if (a === 'del-photo') {
    const [p] = P(b.dataset.slot).splice(+b.dataset.i, 1);
    if (p && p.fileId) call('supprimerPhoto', { fileId: p.fileId }).catch(() => {});
  } else return;
  pendingClear = null;
  save(); renderSaisie();
});
function alertePanel(msg) { const el = $('checkPanel'); if (el) el.innerHTML = `<div class="panel ko"><h3>Action impossible</h3><span>${esc(msg)}</span></div>`; }

/* Photos : compression dans le téléphone (1600 px max, JPEG ~72 %), puis envoi une par une dans le Drive */
async function addPhotos(input) {
  const slot = input.dataset.slot, label = input.dataset.label, fichiers = [...input.files];
  input.value = '';
  for (const f of fichiers) {
    let p;
    try { const [c, prise] = await Promise.all([compress(f), exifDate(f)]); p = { ...c, cap: label, prise, _up: true }; }
    catch (e) { continue; }
    P(slot).push(p); renderSaisie();
    try {
      const r = await call('envoyerPhoto', { id: V.id, data: p.src, nom: label });
      p.fileId = r.fileId; delete p._up; cachePhotos.set(r.fileId, p.src);
      save();
    } catch (e) {
      const l = P(slot), i = l.indexOf(p); if (i >= 0) l.splice(i, 1);
      alertePanel('Une photo n\'a pas pu être envoyée (réseau ?). Ajoute-la à nouveau. Détail : ' + e.message);
    }
    renderSaisie();
  }
}
function exportData() {
  const t = T(), st = S(), c = compute();
  return JSON.stringify({ app: 'VisiTrac', version: 1, trame: t.id, values: st.values, facades: st.facades, surfaces: st.surfaces || [],
    photos: Object.fromEntries(Object.entries(st.photos || {}).map(([k, l]) => [k, l.length])),
    calculs: c.ite ? c.ite.tot : c.surf ? { surfaces: c.surf.total } : { pac: c.pac } });
}
function copyData() {
  const txt = exportData(), out = $('copyOut');
  const show = ok => { out.innerHTML = `<div class="panel ${ok ? 'okp' : 'ko'}"><h3>${ok ? 'Données copiées' : 'Copie automatique impossible'}</h3><span>${ok ? 'Tu peux les coller dans la conversation avec Claude si besoin.' : 'Sélectionne tout le texte ci-dessous et copie-le.'}</span><textarea class="inp copybox" id="copyTxt" readonly>${esc(txt)}</textarea></div>`; if (!ok) { const ta = $('copyTxt'); ta.focus(); ta.select(); } };
  try { navigator.clipboard.writeText(txt).then(() => show(true), () => show(false)); } catch (e) { show(false); }
}

$('btnSend').onclick = () => {
  const val = validate(), el = $('checkPanel');
  if (PRESTA) {
    el.innerHTML = val.out.length
      ? `<div class="panel ko" tabindex="-1"><h3>Il manque ${val.out.length} élément${val.out.length > 1 ? 's' : ''} avant l'envoi</h3><ul>${val.out.map(m => `<li><b>${esc(m[0])}</b> — ${esc(m[1])}</li>`).join('')}</ul><span class="admin-note">Complète ces points : la visite ne peut pas être envoyée incomplète. Ta saisie est enregistrée.</span></div>`
      : `<div class="panel okp" tabindex="-1"><h3>Visite complète</h3><span>Une fois envoyée, tu ne pourras plus la modifier.</span><div><button class="primary" data-act="soumettre">Confirmer l'envoi à GESTRAC</button></div></div>`;
  } else {
    el.innerHTML = val.out.length
      ? `<div class="panel ko" tabindex="-1"><h3>Il manque ${val.out.length} élément${val.out.length > 1 ? 's' : ''}</h3><ul>${val.out.map(m => `<li><b>${esc(m[0])}</b> — ${esc(m[1])}</li>`).join('')}</ul><span class="admin-note">Ta saisie est enregistrée dans le Drive au fur et à mesure.</span></div>`
      : `<div class="panel okp" tabindex="-1"><h3>Visite complète</h3><span>Passe sur « Aperçu du rapport » pour générer le PDF.</span></div>`;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  el.firstElementChild.focus({ preventScroll: true });
};

/* ---------- Démarrage : lien de mission (?m=…) ou espace administrateur ---------- */
function demarrer() {
  const go = params => {
    if (params && params.demande) { CLIENT = true; JETONC = params.demande; vue = 'portail'; render(); }
    else if (params && params.m) { PRESTA = true; JETON = params.m; vue = 'visite'; $('main').innerHTML = '<div class="admin-note">Ouverture de la mission…</div>'; ouvrirVisite(''); }
    else render();
  };
  if (SITE_API && SITE_API.indexOf('/exec') < 0) { $('main').innerHTML = '<div class="panel ko"><h3>VisiTrac n\'est pas encore configuré</h3><span>Le fichier config.js doit contenir l\'adresse de ton application Apps Script (celle qui finit par /exec).</span></div>'; return; }
  if (SITE_API) return go(Object.fromEntries(new URLSearchParams(location.search)));
  try { google.script.url.getLocation(loc => go(loc.parameter || {})); }
  catch (e) { go(Object.fromEntries(new URLSearchParams(location.search))); }
}
demarrer();
/* accès pour les tests automatiques */
window.__vt = { get V() { return V; }, S: () => S(), cachePhotos };
})();
